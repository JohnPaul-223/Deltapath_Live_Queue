<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b10" />
    <title>Deltapath API Mapper</title>
  </head>
  <body>
    <div id="root">
      <main style="height:100vh;display:grid;grid-template-columns:320px 1fr;background:#090b10;color:#eef0f7;font-family:'Segoe UI',Arial,sans-serif">
        <aside style="border-right:1px solid #20242f;padding:26px 24px">
          <div style="display:flex;align-items:center;gap:12px"><div style="width:38px;height:38px;border-radius:10px;background:#7c6bff;display:grid;place-items:center;font-weight:bold;font-size:20px">D</div><div><strong>Deltapath</strong><br><small style="color:#686f80">API Mapper</small></div></div>
          <div style="margin-top:42px">
            <label style="display:block;color:#9aa1b2;font-size:12px;margin-bottom:18px">Server address<div style="height:46px;margin-top:8px;border:1px solid #282c38;border-radius:9px;background:#11141b;padding:12px;color:#686f80">https://uc-server.local</div></label>
            <label style="display:block;color:#9aa1b2;font-size:12px;margin-bottom:18px">ACL username<div style="height:46px;margin-top:8px;border:1px solid #282c38;border-radius:9px;background:#11141b;padding:12px;color:#686f80">Enter username</div></label>
            <label style="display:block;color:#9aa1b2;font-size:12px;margin-bottom:18px">Password<div style="height:46px;margin-top:8px;border:1px solid #282c38;border-radius:9px;background:#11141b;padding:12px;color:#686f80">Enter password</div></label>
            <div style="height:48px;border:0;border-radius:9px;background:#1a1e28;color:#9aa1b2;display:grid;place-items:center;font-size:13px">Preparing mapper…</div>
          </div>
        </aside>
        <section>
          <header style="height:94px;border-bottom:1px solid #20242f;padding:24px 30px"><small style="color:#686f80;letter-spacing:.18em">DISCOVERY CANVAS</small><br><strong>Deltapath call architecture</strong></header>
          <div style="height:calc(100vh - 94px);display:grid;place-items:center;color:#686f80">Loading workspace…</div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
